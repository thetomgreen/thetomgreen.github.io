        const STORE = "ld-take3-pw";
        const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
        async function unlock(pw) {
          const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
          const key = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: bytes(payload.salt), iterations: payload.iter, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
          const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(payload.iv) }, key, bytes(payload.ct));
          document.getElementById("lock").remove();
          document.getElementById("unlocked").innerHTML = new TextDecoder().decode(plain);
          localStorage.setItem(STORE, pw);
        }
        const form = document.getElementById("lock-form");
        const status = document.getElementById("lock-status");
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          status.textContent = "Checking…";
          status.className = "text-center font-body-md text-on-surface-variant min-h-[1.5rem]";
          try {
            await unlock(document.getElementById("pw").value.trim().toLowerCase());
          } catch {
            status.textContent = "That's not it. Try again?";
            status.className = "text-center font-body-md text-red-400 min-h-[1.5rem]";
          }
        });
        const saved = localStorage.getItem(STORE);
        if (saved) unlock(saved).catch(() => localStorage.removeItem(STORE));
      })();
