<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The viewport is the whole point of this page existing.
       Google's picker rendered inside `ASWebAuthenticationSession` put its
       action button out of reach at phone width — the owner confirmed on
       2026-09-23 that it DOES appear in landscape, so the picker can draw it
       and the viewport it was handed is what was wrong. In a `WKWebView` we
       own the viewport, and `picker.js` will widen this tag if the app asks
       it to. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="referrer" content="origin">
  <title>Choose a document</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <!-- Everything here is fallback. In the app the Google picker covers the
       whole page within a second of load; this is what is underneath it, and
       what a person sees if they open the URL in a browser, if the Picker
       script is blocked, or if something goes wrong. It must therefore read
       sensibly on its own and never look like a broken page. -->
  <main class="card" id="card">
    <h1 id="headline">Choose a document</h1>
    <p id="detail">Opening your Google Drive…</p>
    <button id="retry" type="button" class="hidden">Try again</button>
    <button id="cancel" type="button" class="hidden">Close</button>
  </main>

  <script src="https://apis.google.com/js/api.js" defer></script>
  <script src="picker.js?v=1" defer></script>
</body>
</html>
